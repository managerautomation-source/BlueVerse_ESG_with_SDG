main{max-width:1180px;margin:0 auto;padding:20px}
.hero{border-radius:14px;padding:20px;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .n{font-size:64px;font-weight:700;line-height:1}.hero h2{margin:0;font-size:24px}.hero p{margin:4px 0 0;max-width:640px;opacity:.95}
.hero .idx{margin-left:auto;text-align:center;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 18px}.idx span{font-size:30px;font-weight:700;display:block}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.22);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.k small{color:var(--mut);display:block;font-size:12.5px}.k strong{font-size:26px;font-weight:700}.k em{font-style:normal;color:var(--mut);font-size:13px;margin-left:3px}
.k svg{width:100%;height:30px;display:block;margin-top:4px}
.st{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ok);margin-right:6px}.st.w{background:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
section h3{margin:0 0 8px;font-size:16px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;border-bottom:1px solid var(--ink);padding:6px 8px 6px 0}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
ul{margin:0;padding-left:18px}li{margin:5px 0}
.alert b{color:var(--warn)}.kpiout{margin-top:8px;font-size:13.5px;color:var(--mut);font-style:italic}
.stmt{font-style:italic}
.stmt button{margin-top:10px;font-style:normal;border:1px solid var(--teal);background:none;color:var(--teal);border-radius:8px;padding:4px 12px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.oc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0;text-align:left;color:var(--ink);overflow:hidden}
.oc div{padding:10px 12px;color:#fff;font-weight:600;display:flex;justify-content:space-between}
.oc p{margin:0;padding:10px 12px;font-size:13.5px;color:var(--mut)}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid currentColor}
footer{color:var(--mut);font-size:12.5px;padding:8px 0 24px}
</style>

const $=s=>document.querySelector(s),nav=$('#nav'),main=$('#main');let cur='all',vals={};
const fmt=(v,d)=>Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
function spark(c,seed){let p=[],x=seed*7+3;for(let i=0;i<14;i++){x=(x*9301+49297)%233280;p.push(12+(x/233280)*14+i*.4)}
 return `<svg viewBox="0 0 140 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="2" points="${p.map((y,i)=>i*10.7+','+(30-y)).join(' ')}"/></svg>`}
function mkNav(){let h=`<button role="tab" aria-selected="${cur=='all'}" data-t="all"><b style="background:#1b9aa0">★</b>Overview</button>`;
 Object.keys(S).forEach(i=>h+=`<button role="tab" aria-selected="${cur==i}" data-t="${i}"><b style="background:${C[i]}">${i}</b>${S[i].sn||S[i].n.split(' ')[0]}</button>`);nav.innerHTML=h}
function overview(){let all=Object.keys(C).map(Number).sort((a,b)=>a-b),h=`<h2 style="margin:0">Coverage of BlueVerse SDG mapping</h2><p style="color:var(--mut);margin:4px 0 0">11 SDGs, 14 targets. Every SDG has its own tab, built from IoT, system and manual data sources.</p><div class="ov">`;
 all.forEach(i=>{const d=DONE[i],s=S[i],name=d?d[0]:s.n,idx=d?d[1]:s.idx,tag=d?'Spec from PDF':s.f;
 h+=`<button class="oc" data-t="${d?'all':i}"><div style="background:${C[i]}"><span>SDG ${i}</span><span>${idx}/100</span></div><p><b style="color:var(--ink)">${name}</b><br><span class="tag">${tag}</span></p></button>`});
 const avg=Math.round(all.reduce((a,i)=>a+(DONE[i]?DONE[i][1]:S[i].idx),0)/all.length);
 main.innerHTML=h+`</div><section style="margin-top:16px"><h3>Overall ESG score: ${avg} / 100</h3><p style="margin:0;color:var(--mut)">Simple average of the 11 SDG indices. Replace with your weighting once you finalise the scoring method.</p></section><footer>Demo values. Connect each tile to its SCADA/IoT tag to go live.</footer>`}
function panel(i){const s=S[i];vals[i]=vals[i]||s.k.map(k=>k[1]);
 let h=`<div class="hero" style="background:${C[i]}"><div class="n">${i}</div><div><h2>SDG ${i} – ${s.n}</h2><p>${s.o}</p><span class="chip">Data type: ${s.f}</span></div><div class="idx">SDG ${i} Index<span>${s.idx}/100</span></div></div>`;
 h+=`<div class="kpis">`+s.k.map((k,j)=>`<div class="k"><small><span class="st${k[5]?' w':''}"></span>${k[0]}</small><strong id="v${j}">${fmt(vals[i][j],k[3])}</strong><em>${k[2]}</em>${spark(C[i],i*10+j)}</div>`).join('')+`</div><div class="grid">`;
 s.t.forEach(t=>{h+=`<section><h3>${t[0]}</h3><div class="sc"><table><tr><th>Metric</th><th>Live value</th><th>Trend / limit</th></tr>${t[1].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</table></div><div class="kpiout">KPI output: ${t[2]}</div></section>`});
 h+=`<section><h3>SDG ${i} mapping panel (audit-ready)</h3><div class="sc"><table><tr><th>Target</th><th>Live evidence</th><th>Status</th></tr>${s.m.map(m=>`<tr><td><b>${m[0]}</b> – ${m[1]}</td><td>${m[2]}</td><td><span class="st"></span></td></tr>`).join('')}</table></div></section>`;
 h+=`<section class="alert"><h3>Alerts & actions</h3><ul>${s.a.map(a=>`<li><b>Alert:</b> ${a[0]} → <i>${a[1]}</i></li>`).join('')}</ul></section>`;
 h+=`<section><h3>Data refresh & governance</h3><ul><li><b>Refresh rate:</b> 30 sec for sensors, daily roll-up for KPIs</li><li><b>Sources:</b> ${s.src}</li><li><b>Audit trail:</b> Timestamped, sensor ID-linked, tamper-evident</li></ul></section>`;
 h+=`<section><h3>One-line SDG ${i} statement (auto-generated)</h3><p class="stmt" id="stm"></p><button id="cp">Copy statement</button></section></div><footer>Demo values. Values update every few seconds to show live behaviour.</footer>`;
 main.innerHTML=h;stmt(i);$('#cp').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText($('#stm').textContent).then(()=>e.target.textContent='Copied').catch(()=>{})}}
function stmt(i){const s=S[i];$('#stm').textContent='"'+s.s.replace(/\{(\d)\}/g,(m,n)=>fmt(vals[i][n],s.k[n][3]))+'"'}
function show(t){cur=t;mkNav();t=='all'?overview():panel(t);scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)});
setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString('en-IN');if(cur=='all')return;const s=S[cur];
 s.k.forEach((k,j)=>{if(!k[4])return;const b=k[1],v=vals[cur][j]+(Math.random()-.5)*b*k[4]/100;vals[cur][j]=Math.min(Math.max(v,b*.97),b*1.03);if(k[2]=='%'&&vals[cur][j]>100)vals[cur][j]=100;$('#v'+j).textContent=fmt(vals[cur][j],k[3])});stmt(cur)},4000);
$('#clk').textContent=new Date().toLocaleTimeString('en-IN');
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
show('all');
</script>
</body>
</html>
